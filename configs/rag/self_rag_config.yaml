experiment:
  max_cost: 2.0
  enable_autoprompt: false

planner:
  max_rounds: 30
  model: gemini-3.8-flash
  temperature: 1.0
  top_p: 1.0
  max_tokens: 8192
  prompt: prompts/rag_planner_prompt.yaml
  toolset:
    - run_command
    - submit_flag
    - giveup
    - delegate

# Executor A: General-purpose
executor:
  max_rounds: 50
  model: gemini-3.8-flash
  temperature: 1.0
  top_p: 1.0
  max_tokens: 8192
  len_observations: 5
  prompt: prompts/rag_executor_a_prompt.yaml
  toolset:
    - run_command
    - finish_task
    - create_file

# Executor B: Binary analysis specialist
executor_b:
  max_rounds: 50
  model: gemini-3.8-flash
  temperature: 1.0
  top_p: 1.0
  max_tokens: 8192
  len_observations: 5
  prompt: prompts/rag_executor_b_prompt.yaml
  toolset:
    - run_command
    - finish_task
    - disassemble
    - decompile
    - create_file

autoprompter:
  max_rounds: 5
  model: gemini-3.8-flash
  temperature: 1.0
  max_tokens: 8192
  prompt: prompts/autoprompt_prompt.yaml
  toolset:
    - run_command
    - generate_prompt

# Self-RAG specific settings
rag:
  mode: self_rag
  relevance_threshold: 5.0
  top_k: 3
  max_hints_per_round: 2
  inject_every: 3
