# Assignment 5 Sweep Template
# Values are substituted by run_assignment5.sh via envsubst:
#   TEMP, TOP_P, MAX_TOKENS, MAX_ROUNDS, SEED
# All agents share the same decoding params so the sweep is clean.

experiment:
  max_cost: 1.5
  enable_autoprompt: False
  seed: 1

planner:
  max_rounds: 30
  model: gemini-2.5-flash
  temperature: 0.0
  top_p: 1.0
  max_tokens: 8192
  prompt: prompts/dual_planner_prompt.yaml
  toolset:
    - run_command
    - submit_flag
    - giveup
    - delegate

executor:
  max_rounds: 50
  model: gemini-2.5-flash
  temperature: 0.0
  top_p: 1.0
  max_tokens: 8192
  len_observations: 5
  prompt: prompts/executor_a_connect_prompt.yaml
  toolset:
    - run_command
    - finish_task
    - create_file
    - connect_to_server
    - connect_disconnect
    - connect_readline
    - connect_sendline
    - connect_read_all

executor_b:
  max_rounds: 50
  model: gemini-2.5-flash
  temperature: 0.0
  top_p: 1.0
  max_tokens: 8192
  len_observations: 5
  prompt: prompts/executor_b_connect_prompt.yaml
  toolset:
    - run_command
    - finish_task
    - disassemble
    - decompile
    - create_file
    - connect_to_server
    - connect_disconnect
    - connect_readline
    - connect_sendline
    - connect_read_all

autoprompter:
  max_rounds: 30
  model: gemini-2.5-flash
  temperature: 0.0
  top_p: 1.0
  max_tokens: 8192
  prompt: prompts/autoprompt_prompt.yaml
  toolset:
    - run_command
    - generate_prompt
